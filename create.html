<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레시피 작성하기 · 자신의 레시피를 세상으로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gowun+Dodum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="create.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="자신의 레시피를 세상으로 홈">
        <span class="brand-mark">R</span>
        <span>Recipe to World</span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="index.html#story">우리의 이야기</a>
        <a href="feed.html">레시피 둘러보기</a>
        <a href="create.html">레시피 만들기</a>
      </nav>
      <button class="menu-button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    </header>

    <main class="create-page">
      <div class="create-page-heading">
        <p class="section-kicker">SHARE YOUR RECIPE</p>
        <h1>나만의 레시피를<br /><em>세상에 기록해요.</em></h1>
        <p class="create-page-sub">사진이나 조리 영상을 곁들이면 다른 사람이 훨씬 쉽게 따라 만들 수 있어요.</p>
      </div>

      <form id="recipe-form" class="recipe-form" novalidate>
        <section class="form-block">
          <label for="title">레시피 이름 <span class="required">*</span></label>
          <input id="title" name="title" type="text" placeholder="예: 반숙란 아보카도 토스트" required />

          <div class="form-row">
            <div>
              <label for="category">카테고리</label>
              <select id="category" name="category">
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식" selected>양식</option>
                <option value="중식">중식</option>
                <option value="아시안">아시안</option>
                <option value="베이킹/디저트">베이킹/디저트</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div>
              <label for="duration">예상 소요시간</label>
              <input id="duration" name="duration" type="text" placeholder="예: 15분" />
            </div>
          </div>

          <label for="author">작성자 닉네임 <span class="required">*</span></label>
          <input id="author" name="author" type="text" placeholder="예: 오후의 레시피" required />
        </section>

        <section class="form-block">
          <label>대표 사진 / 요리 과정 미디어</label>
          <p class="field-hint">완성 사진, 과정 사진, 조리 영상을 자유롭게 올려보세요. (이미지·동영상, 여러 개 선택 가능)</p>
          <label class="media-drop" for="media-input">
            <input id="media-input" type="file" accept="image/*,video/*" multiple hidden />
            <span class="media-drop-icon">＋</span>
            <span>클릭해서 사진·동영상 추가하기</span>
          </label>
          <div id="media-preview" class="media-preview"></div>
        </section>

        <section class="form-block">
          <label>재료 <span class="required">*</span></label>
          <div id="ingredient-list" class="ingredient-list"></div>
          <button type="button" id="add-ingredient" class="button button-text small">+ 재료 추가</button>
        </section>

        <section class="form-block">
          <label>조리 순서 <span class="required">*</span></label>
          <div id="step-list" class="step-list"></div>
          <button type="button" id="add-step" class="button button-text small">+ 단계 추가</button>
        </section>

        <section class="form-block">
          <label for="tags">태그 <span class="hint-inline">(쉼표로 구분)</span></label>
          <input id="tags" name="tags" type="text" placeholder="예: 자취요리, 초간단, 브런치" />

          <label for="tips">팁 / 주의사항</label>
          <textarea id="tips" name="tips" rows="3" placeholder="더 맛있게 만드는 팁이 있다면 알려주세요."></textarea>
        </section>

        <div id="form-message" class="form-message" role="status"></div>

        <div class="form-actions">
          <button type="submit" class="button button-primary" id="submit-button">레시피 올리기 <span>→</span></button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>Recipe to World</span></a>
      <p>당신의 레시피를 세상으로.</p>
      <p>© 2026 Recipe to World</p>
    </footer>
  </div>
  <script src="script.js"></script>
  <script type="module" src="supabase.js"></script>
  <script type="module" src="create.js"></script>
</body>
</html>
