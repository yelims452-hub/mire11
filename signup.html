<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · 자신의 레시피를 세상으로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gowun+Dodum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="create.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="자신의 레시피를 세상으로 홈">
        <span class="brand-mark">R</span>
        <span>Recipe to World</span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="index.html#story">우리의 이야기</a>
        <a href="feed.html">레시피 둘러보기</a>
        <a href="create.html">레시피 만들기</a>
        <a href="extract.html">레시피 추출</a>
      </nav>
      <button class="menu-button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <a class="login-link" href="login.html">로그인</a>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <p class="section-kicker">JOIN US</p>
        <h1>나만의 계정을<br /><em>만들어요.</em></h1>

        <form id="signup-form" class="recipe-form" novalidate>
          <section class="form-block">
            <label for="username">아이디 <span class="required">*</span></label>
            <input id="username" type="text" placeholder="영문/숫자/밑줄, 3~20자" required />
            <p class="field-hint" id="username-hint"></p>

            <label for="email">이메일 <span class="required">*</span> <span class="hint-inline">(확인 메일이 발송돼요. 실제 사용 가능한 주소를 입력해주세요)</span></label>
            <input id="email" type="email" placeholder="example@email.com" required />

            <label for="password">비밀번호 <span class="required">*</span></label>
            <input id="password" type="password" placeholder="6자 이상" required minlength="6" />

            <label for="password2">비밀번호 확인 <span class="required">*</span></label>
            <input id="password2" type="password" required minlength="6" />

            <label for="birthdate">생년월일 <span class="required">*</span> <span class="hint-inline">(비밀번호를 잊었을 때 본인확인용으로 사용돼요)</span></label>
            <input id="birthdate" type="date" required />

            <label for="bio">자기소개</label>
            <textarea id="bio" rows="3" placeholder="어떤 요리를 좋아하는지 소개해주세요."></textarea>
          </section>

          <div id="form-message" class="form-message" role="status"></div>

          <div class="form-actions">
            <button type="submit" class="button button-primary" id="submit-button">회원가입 <span>→</span></button>
          </div>
        </form>

        <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>Recipe to World</span></a>
      <p>당신의 레시피를 세상으로.</p>
      <p>© 2026 Recipe to World</p>
    </footer>
  </div>
  <script src="script.js"></script>
  <script type="module" src="supabase.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="signup.js"></script>
</body>
</html>
