<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · 자신의 레시피를 세상으로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gowun+Dodum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="create.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="자신의 레시피를 세상으로 홈">
        <span class="brand-mark">R</span>
        <span>Recipe to World</span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="index.html#story">우리의 이야기</a>
        <a href="feed.html">레시피 둘러보기</a>
        <a href="create.html">레시피 만들기</a>
        <a href="extract.html">레시피 추출</a>
        <a href="ranking.html">인기 랭킹</a>
      </nav>
      <button class="menu-button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <a class="login-link" href="login.html">로그인</a>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <p class="section-kicker">JOIN US</p>
        <h1>나만의 계정을<br /><em>만들어요.</em></h1>

        <!-- 회원가입 진행 단계 표시 -->
        <div class="signup-steps" id="signup-steps" aria-label="회원가입 진행 단계">
          <span class="signup-step is-active" data-step="1"><i>1</i>기본 정보</span>
          <span class="signup-step" data-step="2"><i>2</i>이메일 인증</span>
          <span class="signup-step" data-step="3"><i>3</i>아이디·비밀번호</span>
        </div>

        <!-- 1단계: 이름 + 생년월일 -->
        <form id="step1-form" class="recipe-form" novalidate>
          <section class="form-block">
            <label for="name">이름 <span class="required">*</span></label>
            <input id="name" type="text" placeholder="실명을 입력해주세요" required />

            <label for="birthdate">생년월일 <span class="required">*</span> <span class="hint-inline">(비밀번호를 잊었을 때 본인확인용으로 사용돼요)</span></label>
            <input id="birthdate" type="date" required />
          </section>

          <div id="step1-message" class="form-message" role="status"></div>

          <div class="form-actions">
            <button type="submit" class="button button-primary" id="step1-submit">다음 <span>→</span></button>
          </div>
        </form>

        <!-- 2단계: 이메일 입력 + 인증번호 확인 -->
        <form id="step2-form" class="recipe-form" novalidate hidden>
          <section class="form-block">
            <label for="email">이메일 <span class="required">*</span></label>
            <div class="otp-input-row">
              <input id="email" type="email" placeholder="example@email.com" required />
              <button type="button" class="button button-text small" id="send-code-button">인증번호 받기</button>
            </div>
            <p class="field-hint" id="email-hint"></p>

            <div id="otp-block" hidden>
              <label for="otp-code">인증번호 <span class="required">*</span> <span class="hint-inline">(이메일로 받은 8자리 숫자를 입력해주세요)</span></label>
              <div class="otp-input-row">
                <input id="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="8자리 숫자" maxlength="8" />
                <button type="button" class="button button-text small" id="resend-code-button">재전송</button>
              </div>
            </div>
          </section>

          <div id="step2-message" class="form-message" role="status"></div>

          <div class="form-actions">
            <button type="button" class="button button-text" id="step2-back">이전</button>
            <button type="button" class="button button-primary" id="step2-submit" disabled>인증 확인 <span>→</span></button>
          </div>
        </form>

        <!-- 3단계: 아이디 + 비밀번호 -->
        <form id="step3-form" class="recipe-form" novalidate hidden>
          <section class="form-block">
            <label for="username">아이디 <span class="required">*</span></label>
            <input id="username" type="text" placeholder="영문/숫자/밑줄, 3~20자" required />
            <p class="field-hint" id="username-hint"></p>

            <label for="password">비밀번호 <span class="required">*</span></label>
            <input id="password" type="password" placeholder="6자 이상" required minlength="6" />

            <label for="password2">비밀번호 확인 <span class="required">*</span></label>
            <input id="password2" type="password" required minlength="6" />

            <label for="bio">자기소개</label>
            <textarea id="bio" rows="3" placeholder="어떤 요리를 좋아하는지 소개해주세요."></textarea>
          </section>

          <div id="step3-message" class="form-message" role="status"></div>

          <div class="form-actions">
            <button type="submit" class="button button-primary" id="step3-submit">회원가입 완료 <span>→</span></button>
          </div>
        </form>

        <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <a class="brand" href="index.html"><span class="brand-mark">R</span><span>Recipe to World</span></a>
      <p>당신의 레시피를 세상으로.</p>
      <p>© 2026 Recipe to World</p>
    </footer>
  </div>
  <script src="script.js"></script>
  <script type="module" src="supabase.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="signup.js"></script>
</body>
</html>
